[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-rag-pipeline"
version = "0.1.0"
description = "Phase 1: Indic Multilingual RAG Ingestion Pipeline (sa/hi/mr/gu/en) with EmbeddingGemma-2 / BGE-M3, Qdrant hybrid store, FastAPI service and Gradio studio."
readme = "PHASE_1_INGESTION.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Indic RAG Team" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-core>=0.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
# Heavy / network-dependent extras; the core pipeline ships deterministic
# fallbacks so it runs even when these cannot be installed.
embeddings = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "transformers>=4.45",
]
qdrant = ["qdrant-client>=1.12"]
nlp = [
    "fasttext-wheel>=0.9.2",
    "indic-nlp-library>=0.9",
]
studio = ["gradio>=5.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
indic-rag-ingest = "scripts.run_ingestion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
