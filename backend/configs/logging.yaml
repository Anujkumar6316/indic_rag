version: 1

formatters:
  json:
    (): indic_rag.logging_setup.JsonFormatter
  console:
    format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout
  rotating_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: logs/indic_rag.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  indic_rag:
    level: DEBUG
    handlers: [console, rotating_file]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false
  qdrant_client:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
